# Change port to 3307 to match your XAMPP MySQL settings
spring.datasource.url=jdbc:mysql://localhost:3307/gym_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Change Spring Boot server port to avoid the NI WebServer conflict on 8080
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true