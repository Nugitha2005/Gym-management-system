spring.application.name=GymManagement

# Server Configuration
server.port=8081

# Database Configuration (XAMPP MySQL Port 3307 & gym_db)
spring.datasource.url=jdbc:mysql://localhost:3307/gym_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Member A Data Initialization Setup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always