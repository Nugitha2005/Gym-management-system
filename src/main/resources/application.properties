spring.application.name=GymManagement

# Your specific database connection
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Tells Spring Boot to automatically create your tables and show the SQL in the terminal
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Sets the local web server port
server.port=8081

# Member A's configuration to initialize default data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always